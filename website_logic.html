<script>
        // JAVASCRIPT LOGIC
        const API_KEY = '054859375ce0b363c9c06f357ae065b6'; // <--- ADD YOUR KEY HERE
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movie-grid');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const modal = document.getElementById('review-modal');
        const closeBtn = document.querySelector('.close-btn');
        let currentMovieId = null;

        // Fetch Movies from TMDB
        async function getMovies(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if(data.results) {
                    displayMovies(data.results);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Display Movies
        function displayMovies(movies) {
            movieGrid.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                
                const movieEl = document.createElement('div');
                movieEl.classList.add('movie-card');
                movieEl.innerHTML = `
                    <img src="${IMG_URL + movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <span class="rating">★ ${movie.vote_average}</span>
                    </div>
                `;
                movieEl.onclick = () => openReviewModal(movie);
                movieGrid.appendChild(movieEl);
            });
        }

        // Search Logic
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value;
            if (query && API_KEY === '054859375ce0b363c9c06f357ae065b6') {
                getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${query}`);
                document.getElementById('section-title').innerText = `Results for "${query}"`;
            } else if (API_KEY !== '054859375ce0b363c9c06f357ae065b6') {
                alert("Please add your TMDB API Key in the code first!");
            }
        });

        // Review Modal Logic
        function openReviewModal(movie) {
            currentMovieId = movie.id;
            document.getElementById('modal-movie-title').innerText = movie.title;
            document.getElementById('review-text').value = '';
            modal.style.display = 'block';
            loadReviews(movie.id);
        }

        // Save Review to LocalStorage
        document.getElementById('save-review').onclick = () => {
            const text = document.getElementById('review-text').value;
            const rating = document.getElementById('review-rating').value;
            
            if(!text) {
                alert("Please write a review before saving.");
                return;
            }

            const review = {
                text,
                rating,
                date: new Date().toLocaleDateString()
            };

            let reviews = JSON.parse(localStorage.getItem(currentMovieId)) || [];
            reviews.push(review);
            localStorage.setItem(currentMovieId, JSON.stringify(reviews));
            
            document.getElementById('review-text').value = '';
            loadReviews(currentMovieId);
        };

        // Load Reviews from LocalStorage
        function loadReviews(movieId) {
            const reviewsDiv = document.getElementById('existing-reviews');
            const reviews = JSON.parse(localStorage.getItem(movieId)) || [];
            
            if(reviews.length === 0) {
                reviewsDiv.innerHTML = '<p style="color: #888;">No reviews yet. Be the first!</p>';
                return;
            }

            reviewsDiv.innerHTML = '<h3>Your Previous Reviews:</h3>' + reviews.map(r => `
                <div class="review-item">
                    <p><strong style="color: #ffc107;">Rating: ${r.rating}/10</strong> <small style="color: #888; margin-left: 10px;">${r.date}</small></p>
                    <p style="margin-bottom: 0;">${r.text}</p>
                </div>
            `).join('');
        }

        // Close Modal
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

        // Initial Load (Popular Movies)
        if(API_KEY === '054859375ce0b363c9c06f357ae065b6') {
            getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
        } else {
            movieGrid.innerHTML = "<h2>Please enter your API Key in the script to load movies.</h2>";
        }
    </script>
