<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRate | Movie Reviews</title>
    <style>
        /* CSS STYLES */
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --text-color: #ffffff;
            --card-bg: #2f2f2f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #search-form {
            display: flex;
        }

        #search-form input {
            padding: 12px;
            width: 250px;
            border-radius: 5px 0 0 5px;
            border: none;
            outline: none;
        }

        #search-form button {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            padding: 20px 5%;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .movie-card:hover {
            transform: translateY(-10px);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating {
            color: #ffc107;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: #222;
            margin: 5% auto;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 2rem;
            cursor: pointer;
            color: #bbb;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            box-sizing: border-box;
            resize: vertical;
        }

        .rating-input {
            margin-bottom: 20px;
        }

        #save-review {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        #existing-reviews {
            margin-top: 30px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }

        .review-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CineRate</div>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for a movie...">
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <h2 id="section-title">Trending Movies</h2>
        <div id="movie-grid" class="movie-grid">
            <!-- Movies injected here -->
        </div>
    </main>

    <!-- Review Modal -->
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-movie-title">Movie Title</h2>
            
            <div class="rating-input">
                <label>Your Rating: </label>
                <input type="number" id="review-rating" min="1" max="10" value="10"> / 10
            </div>
            
            <textarea id="review-text" placeholder="Write your thoughts here..."></textarea>
            
            <button id="save-review">Post Review</button>

            <div id="existing-reviews"></div>
        </div>
    </div>

    <script>
        // JAVASCRIPT LOGIC
        const API_KEY = '054859375ce0b363c9c06f357ae065b6'; // <--- ADD YOUR KEY HERE
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movie-grid');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const modal = document.getElementById('review-modal');
        const closeBtn = document.querySelector('.close-btn');
        let currentMovieId = null;

        // Fetch Movies from TMDB
        async function getMovies(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if(data.results) {
                    displayMovies(data.results);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Display Movies
        function displayMovies(movies) {
            movieGrid.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                
                const movieEl = document.createElement('div');
                movieEl.classList.add('movie-card');
                movieEl.innerHTML = `
                    <img src="${IMG_URL + movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <span class="rating">★ ${movie.vote_average}</span>
                    </div>
                `;
                movieEl.onclick = () => openReviewModal(movie);
                movieGrid.appendChild(movieEl);
            });
        }

        // Search Logic
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value;
            if (query && API_KEY === '054859375ce0b363c9c06f357ae065b6') {
                getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${query}`);
                document.getElementById('section-title').innerText = `Results for "${query}"`;
            } else if (API_KEY !== '054859375ce0b363c9c06f357ae065b6') {
                alert("Please add your TMDB API Key in the code first!");
            }
        });

        // Review Modal Logic
        function openReviewModal(movie) {
            currentMovieId = movie.id;
            document.getElementById('modal-movie-title').innerText = movie.title;
            document.getElementById('review-text').value = '';
            modal.style.display = 'block';
            loadReviews(movie.id);
        }

        // Save Review to LocalStorage
        document.getElementById('save-review').onclick = () => {
            const text = document.getElementById('review-text').value;
            const rating = document.getElementById('review-rating').value;
            
            if(!text) {
                alert("Please write a review before saving.");
                return;
            }

            const review = {
                text,
                rating,
                date: new Date().toLocaleDateString()
            };

            let reviews = JSON.parse(localStorage.getItem(currentMovieId)) || [];
            reviews.push(review);
            localStorage.setItem(currentMovieId, JSON.stringify(reviews));
            
            document.getElementById('review-text').value = '';
            loadReviews(currentMovieId);
        };

        // Load Reviews from LocalStorage
        function loadReviews(movieId) {
            const reviewsDiv = document.getElementById('existing-reviews');
            const reviews = JSON.parse(localStorage.getItem(movieId)) || [];
            
            if(reviews.length === 0) {
                reviewsDiv.innerHTML = '<p style="color: #888;">No reviews yet. Be the first!</p>';
                return;
            }

            reviewsDiv.innerHTML = '<h3>Your Previous Reviews:</h3>' + reviews.map(r => `
                <div class="review-item">
                    <p><strong style="color: #ffc107;">Rating: ${r.rating}/10</strong> <small style="color: #888; margin-left: 10px;">${r.date}</small></p>
                    <p style="margin-bottom: 0;">${r.text}</p>
                </div>
            `).join('');
        }

        // Close Modal
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

        // Initial Load (Popular Movies)
        if(API_KEY === '054859375ce0b363c9c06f357ae065b6') {
            getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
        } else {
            movieGrid.innerHTML = "<h2>Please enter your API Key in the script to load movies.</h2>";
        }
    </script>
</body>
</html>
